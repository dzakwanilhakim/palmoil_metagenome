# Cohorts included after the gold-QC stage.
#
# Default: analyze every supported cohort.
selected: 16S_Nursery

# Additional analysis-only kebun groups. Original kebun are always retained.
# Groups may overlap: for example NSA contributes to both AAL and Sampoerna,
# but is counted only once inside each group. These groups are added to every
# per-kebun analysis and are NOT added to pooled cross-kebun analyses.
combined_kebun:
  AAL:
    by_cohort:
      16S_TM: [AMR, NSA]
      # Letawa is coded as LTW in the project metadata.
      16S_Nursery: [TPP, GSDI, LTW]
  Sampoerna:
    by_cohort:
      16S_TM: [AT, NSA]

# To run a single cohort, use one of:
# selected: 16S_TM
# selected: ITS_TM
# selected: 16S_Nursery
#
# Multiple cohorts are also accepted:
# selected: [16S_TM, ITS_TM]
