# =============================================================================
# plot_style.yaml — shared ggplot styling for Dashboard + Analysis output
#   plots (per project note: "increase the font size, bold, and set in config")
# =============================================================================
base_size: 15
bold_titles: true
bold_axis_text: true
# Stacked bar charts (phylum / genus / species): how many named taxa to show;
# the rest go to "Other". A list makes one chart per value, e.g. [15, 50].
stackbar_top_n: [50]
