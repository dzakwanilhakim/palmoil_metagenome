# =============================================================================
# analysis_thresholds.yaml — cutoffs for the Analysis output stage
#   (ANCOM-BC differential abundance + co-occurrence). Printed before each
#   run, per project note ("set threshold in config then print before
#   processing").
# =============================================================================
da:
  adj_pval_cutoff: 0.05
  min_samples_per_timepoint: 2
  # Recommended by ANCOM-BC2 to reduce false positives. Set false only for a
  # faster development smoke test; do not use that shortcut for final results.
  pseudo_sensitivity: true
  n_cl: 1
  max_taxa_dumbbell: 30
  # Also compare the first vs last usable timepoint per kebun (e.g. T0 vs T3),
  # in addition to the consecutive pairs (T0 vs T1, T1 vs T2, T2 vs T3).
  initial_vs_final: true
  # Trajectory panel (kebun with >= 3 usable timepoints): LFC vs the first
  # timepoint for the top-N taxa. The global test (any change across time)
  # ranks the taxa; it adds run time, set false to rank by the per-timepoint
  # tests only.
  max_taxa_trajectory: 20
  trajectory_global_test: true
  # Limit to these kebun (testing), e.g. [AMR]. Empty = all kebun. Combine
  # with `selected:` in analysis_cohorts.yaml to pick the cohort.
  fields: []

# FAPROTAX is run on 16S species profiles only. Functional groups can overlap,
# so consecutive timepoints are compared with Wilcoxon tests rather than
# treating the collapsed scores as mutually exclusive compositional counts.
faprotax:
  adj_pval_cutoff: 0.05
  min_samples_per_timepoint: 2
  min_prevalence_frac: 0.10
  pseudocount: 1.0e-6
  max_functions_dumbbell: 20
  max_functions_heatmap: 25
  max_functions_trajectory: 8
  # Clinical / host-associated groups: kept in the CSVs (column
  # excluded_from_top = TRUE) but never shown in a Top-N; the next function
  # takes the slot. In soil they mostly reflect species-name artefacts
  # (e.g. Standard-8 calls of E. coli, Brucella, B. anthracis).
  exclude_from_top:
    - human_pathogens_all
    - human_pathogens_septicemia
    - human_pathogens_pneumonia
    - human_pathogens_nosocomia
    - human_pathogens_meningitis
    - human_pathogens_gastroenteritis
    - human_pathogens_diarrhea
    - human_gut
    - human_associated
    - mammal_gut
    - animal_parasites_or_symbionts
    - invertebrate_parasites
    - fish_parasites
    - intracellular_parasites
  python_bin: python3

cooccurrence:
  spearman_cutoff: 0.7
